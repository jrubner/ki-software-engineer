<header appAutoHideHeader class="site-header border-b border-line bg-surface">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-5 py-5 sm:px-8">
    <a routerLink="/" aria-label="BookMonkey home" class="flex items-center gap-3 rounded-lg">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-ink text-accent-soft">
        <svg
          aria-hidden="true"
          class="h-6 w-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 5.5C9 3.8 5.5 4 3 5v14c2.5-1 6-1.2 9 .5m0-14c3-1.7 6.5-1.5 9-.5v14c-2.5-1-6-1.2-9 .5m0-14v14"
          />
        </svg>
      </span>
      <span class="text-xl font-bold tracking-tight text-ink">BookMonkey<span class="text-accent">.</span></span>
    </a>
    <nav aria-label="Main navigation" class="flex flex-wrap items-center justify-end gap-3 sm:gap-6">
      <a routerLink="/reading-list" class="text-link text-sm">Reading list</a>
      <a routerLink="/editorial-recommendations" class="text-link text-sm">Recommendations</a>
      <a routerLink="/gamba" class="text-link text-sm">Book of CK</a>
      <span class="hidden text-sm text-muted lg:block">A little curiosity. A good book.</span>
      <button
        type="button"
        aria-label="Dark mode"
        [attr.aria-pressed]="theme.isDark()"
        class="theme-toggle"
        (click)="theme.toggle()"
      >
        <span class="theme-icon" [class.theme-icon-active]="!theme.isDark()">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4" />
            <path
              stroke-linecap="round"
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
            />
          </svg>
        </span>
        <span class="theme-icon" [class.theme-icon-active]="theme.isDark()">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"
            />
          </svg>
        </span>
      </button>
    </nav>
  </div>
</header>

<main class="flex-1">
  <router-outlet></router-outlet>
</main>

<footer class="shrink-0 border-t border-line bg-surface">
  <div
    class="mx-auto flex max-w-7xl flex-col gap-2 px-5 py-7 text-xs leading-relaxed text-muted sm:flex-row sm:items-center sm:justify-between sm:px-8"
  >
    <span class="font-semibold tracking-wide text-ink">BookMonkey</span>
    <span>Angular Workshop by workshops.de</span>
  </div>
</footer>
