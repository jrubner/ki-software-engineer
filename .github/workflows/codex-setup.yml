name: Codex setup check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codex:
    name: Check Codex connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check API key configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the OPENAI_API_KEY repository secret before running this workflow. See docs/codex-github-actions.md."
            exit 1
          fi

      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Keep Codex last; publish its output in a fresh job.
      - name: Run Codex setup check
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/setup.md
          sandbox: read-only
          safety-strategy: drop-sudo

  report:
    name: Publish setup report
    needs: codex
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Write the run summary
        uses: actions/github-script@v7
        env:
          CODEX_REPORT: ${{ needs.codex.outputs.report }}
        with:
          script: |
            const report = process.env.CODEX_REPORT?.trim();
            if (!report) {
              core.setFailed('Codex returned no setup report. Inspect the preceding job.');
              return;
            }
            await core.summary
              .addHeading('Codex setup check')
              .addRaw(report)
              .write();
