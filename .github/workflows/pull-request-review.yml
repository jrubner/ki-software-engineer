name: Pull Request Review with Codex

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open pull request targeting the default branch
        required: true
        type: string
      head_sha:
        description: Expected head revision (required for implementation bot dispatch)
        required: false
        type: string

permissions: {}

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      number: ${{ steps.context.outputs.number }}
      fingerprint: ${{ steps.context.outputs.fingerprint }}
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      # Never check out the PR head or merge ref under pull_request_target.
      - name: Checkout trusted base instructions and helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Authorize review and collect bounded PR diff
        id: context
        uses: actions/github-script@v7
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/pull-request-review.cjs');
            await prepare({ github, context, core });
      - name: Prepare an unprivileged Codex user
        if: steps.context.outputs.review == 'true'
        run: |
          sudo adduser --system --home /home/codex-ci --shell /bin/bash --group codex-ci
          sudo usermod -a -G codex-ci runner
          sudo usermod -a -G runner codex-ci
          sudo chown -R runner:codex-ci "$GITHUB_WORKSPACE"
          sudo chmod -R g+rX "$GITHUB_WORKSPACE"
      # Keep Codex last; publish in a fresh job with no API key.
      - name: Review changes with Codex
        if: steps.context.outputs.review == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          prompt-file: .github/codex/prompts/pull-request-review.md
          output-schema-file: .github/codex/pull-request-review.schema.json
          sandbox: read-only
          safety-strategy: unprivileged-user
          codex-user: codex-ci
          allow-bots: true

  publish:
    needs: review
    if: needs.review.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout the same trusted publishing helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Validate revision and publish review comment
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ needs.review.outputs.number }}
          REVIEW_FINGERPRINT: ${{ needs.review.outputs.fingerprint }}
          CODEX_REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            const { publish } = require('./.github/scripts/pull-request-review.cjs');
            await publish({ github, context, core });
